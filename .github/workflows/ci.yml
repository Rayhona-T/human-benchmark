# Continuous integration for HUMAN BENCHMARK (Cycle 10, Task 10.2).
#
# Runs the same checks a developer runs locally (see TESTING.md):
#   frontend  type check, lint, format, unit/component tests, production build
#   backend   ruff (lint + format), mypy (strict), pytest
#   e2e       Playwright browser tests against the production build, one job
#             per browser engine (Chromium, Firefox, WebKit; Task 10.4)
#   audit     known-vulnerability scan of npm and Python dependencies
#             (reported, not blocking yet; see TESTING.md)
#
# No secrets, no deployment, read-only repository access.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile)
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The minimum supported version (pyproject.toml requires >=3.12).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install (pinned)
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Type check (mypy, strict)
        run: python -m mypy
      - name: Tests
        run: python -m pytest

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every engine's result, even when one fails.
      fail-fast: false
      matrix:
        # Each project runs the specs that apply to it (playwright.config.ts):
        # Chromium everything; Firefox and WebKit all but the tests that need
        # the Chrome DevTools Protocol and the browser-independent specs.
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile)
        run: npm ci
      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests (builds and serves the production bundle)
        run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Keep the report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Findings are reported for review; they do not fail the workflow yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: pip-audit (runtime and development requirements)
        # Run even when npm audit reported findings, so both are visible.
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.txt
